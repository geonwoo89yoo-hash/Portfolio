<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15181e">
<title>건우 포트폴리오</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--bg:#15181e;--ink:#eceef2;--ink-2:#a9afba;--accent:#dcae52;--accent-ink:#1a1408;--line:#2c313a}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
    padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
  img{width:88px;height:88px;border-radius:22px}
  h1{margin:0;font-size:22px}
  p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5;max-width:320px}
  a.open{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:14px}
  a.open:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  small{color:var(--ink-2);font-size:12px}
  #install{display:none;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:10px 18px;border-radius:12px}
</style>
</head>
<body>
  <img src="icon-512.png" alt="">
  <h1>건우 포트폴리오</h1>
  <p id="msg">앱을 여는 중이에요…</p>
  <a class="open" id="open" href="https://claude.ai/artifact/UrrtoNiJue8hmafjnb2KWX">포트폴리오 열기</a>
  <button id="install" type="button">홈 화면에 앱 설치</button>
  <small>Danh mục đầu tư · Portfolio</small>
<script>
  const APP_URL = "https://claude.ai/artifact/UrrtoNiJue8hmafjnb2KWX";
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  const standalone = matchMedia("(display-mode: standalone)").matches;
  const msg = document.getElementById("msg");
  if (standalone) {
    // Open the app automatically once per launch; coming back here shows the button.
    let opened = false;
    try { opened = sessionStorage.getItem("opened") === "1"; sessionStorage.setItem("opened", "1"); } catch (e) {}
    if (!opened) { location.href = APP_URL; }
    else { msg.textContent = "다시 열려면 아래 버튼을 눌러 주세요."; }
  } else {
    msg.textContent = "크롬 메뉴(⋮)에서 '앱 설치' 또는 아래 버튼을 누르면 홈 화면에 독립 앱으로 설치돼요.";
  }

  let deferred = null;
  const btn = document.getElementById("install");
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; btn.style.display = "inline-block"; });
  btn.addEventListener("click", async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; btn.style.display = "none"; });
  window.addEventListener("appinstalled", () => { msg.textContent = "설치됐어요. 홈 화면의 아이콘으로 열어 주세요."; });
</script>
</body>
</html>
